name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # The annotate plugin reports each failing test on the run page, with its message.
      - run: pip install -r requirements-dev.txt pytest-github-actions-annotate-failures
      # The page tests drive headless Chrome, which hangs now and then on the macOS runners;
      # the Linux jobs cover them.
      - run: python -m pytest tests -q -ra
        env:
          SECOND_OPINION_SKIP_CHROME: ${{ runner.os == 'macOS' && '1' || '' }}

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci
        working-directory: installer
      - run: npm run check
        working-directory: installer
      - name: Committed install.js matches a fresh build
        run: git diff --exit-code -- install.js
